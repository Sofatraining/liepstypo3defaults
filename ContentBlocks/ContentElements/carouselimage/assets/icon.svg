<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 16 16">
  <!-- Card background with inner border -->
  <rect x="1" y="2" width="14" height="12" rx="1" fill="#ff8172" stroke="#e6735f" stroke-width="0.5"/>
  <!-- Photo glyph (mountains + sun) -->
  <path d="M3 12 L6.2 8.6 L8 10.2 L10.2 7.8 L13 12"
        fill="none" stroke="#ffffff" stroke-width="1"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Sun moved down by 10% to cy=4.7 -->
  <circle cx="10.8" cy="4.7" r="0.9" fill="none" stroke="#ffffff" stroke-width="1"/>
  <!-- Outer frame -->
  <rect x="1" y="2" width="14" height="12" rx="1" fill="none" stroke="#cc5d4a" stroke-width="0.8"/>
</svg>
