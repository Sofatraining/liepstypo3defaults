<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Hintergrund / Box -->
  <rect x="1" y="2" width="14" height="12" rx="1"
        fill="#ff8172" stroke="#e6735f" stroke-width="0.5"/>

  <!-- Überschrift (Headline-Zeile) -->
  <rect x="2.2" y="4.5" width="11.6" height="1.8" rx="0.9"
        fill="#fff" opacity="0.95"/>

  <!-- Kurztext (Text-Zeile) -->
  <rect x="2.2" y="7" width="9.5" height="0.9" rx="0.45"
        fill="#fff" opacity="0.9"/>

  <!-- Button 1 (Primary) -->
  <rect x="2.2" y="10" width="4.5" height="2.2" rx="1.1"
        fill="#fff" opacity="0.95"/>

  <!-- Button 2 (Secondary / Outline) -->
  <rect x="9.3" y="10" width="4.5" height="2.2" rx="1.1"
        fill="none" stroke="#fff" stroke-width="0.6" opacity="0.95"/>

  <!-- Rahmen -->
  <rect x="1" y="2" width="14" height="12" rx="1"
        fill="none" stroke="#cc5d4a" stroke-width="0.8"/>
</svg>
