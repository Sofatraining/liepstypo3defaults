{namespace be=TYPO3\CMS\Backend\ViewHelpers}
<html data-namespace-typo3-fluid="true">

  <f:layout name="Preview"/>

  <f:section name="Header">
      <be:link.editRecord uid="{data.uid}" table="{data.mainType}"><strong>{data.header}</strong></be:link.editRecord>
  </f:section>

  <f:section name="Content">
    <div style="font-weight:600;margin-bottom:.25rem;">
      Elemente für den Download
    </div>

    <f:if condition="{data.items}">
      <f:then>
        <div style="color:#666;margin-bottom:.5rem;">
          Einträge: <f:count subject="{data.items}" />
        </div>

        <ul style="list-style:none;padding:0;margin:0;">
          <f:for each="{data.items}" as="item">
            <li style="display:flex;align-items:center;gap:.5rem;padding:.25rem 0;border-top:1px solid #e5e5e5;">
              <span aria-hidden="true">
                <i class="{f:if(condition: item.icon, then: item.icon, else: 'fa-solid fa-file')}"></i>
              </span>
              <span>
                <f:if condition="{item.title}">
                  <f:then>{item.title}</f:then>
                  <f:else>
                    <f:if condition="{item.file.properties.title}">
                      <f:then>{item.file.properties.title}</f:then>
                      <f:else>{item.file.properties.name}</f:else>
                    </f:if>
                  </f:else>
                </f:if>
              </span>
            </li>
          </f:for>
        </ul>
      </f:then>
      <f:else>
        <em style="color:#666;">Noch keine Einträge angelegt.</em>
      </f:else>
    </f:if>
  </f:section>

  <f:section name="Footer">
      <small>LIEPS - Element</small>
  </f:section>
</html>
