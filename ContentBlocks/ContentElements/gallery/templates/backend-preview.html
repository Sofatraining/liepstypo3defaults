{namespace be=TYPO3\CMS\Backend\ViewHelpers}

<html data-namespace-typo3-fluid="true">

    <f:layout name="Preview" />

    <f:section name="Header">
        <strong>Bilder-Galerie</strong>
    </f:section>

    <f:section name="Content">
        <f:variable name="colCount">
            <f:if condition="{data.header_position} == 'col-lg-6'">
                <f:then>2</f:then>
                <f:else>
                    <f:if condition="{data.header_position} == 'col-xl-4 col-lg-6'">
                        <f:then>3</f:then>
                        <f:else>
                            <f:if condition="{data.header_position} == 'col-xl-3 col-lg-6'">
                                <f:then>4</f:then>
                                <f:else>
                                    <f:if condition="{data.header_position} == 'col-xxl-2 col-xl-3 col-lg-3 col-md-4 col-sm-6'">
                                        <f:then>6</f:then>
                                        <f:else>–</f:else>
                                    </f:if>
                                </f:else>
                            </f:if>
                        </f:else>
                    </f:if>
                </f:else>
            </f:if>
        </f:variable>

        <div>
            Anzahl der Spalten: <strong>{colCount}</strong><br />
            <f:if condition="{data.image}">
                <f:for each="{data.image}" as="image">
					<f:image image="{image}" maxWidth="100" cropVariant="default" style="padding: 10px 15px 0 0;" />
                </f:for>
            </f:if>
        </div>
    </f:section>

    <f:section name="Footer">
        (LIEPS) Element zuletzt geändert am
        <f:format.date format="d.m.Y \u\m H:i:s \U\h\r">{data.rawRecord.tstamp}</f:format.date>
    </f:section>

</html>
