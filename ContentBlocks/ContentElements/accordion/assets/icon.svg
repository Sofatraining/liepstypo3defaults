<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 16 16">
  <!-- Haupthintergrund -->
  <rect x="1" y="1" width="14" height="14" rx="1" fill="#ff8172" stroke="#e6735f" stroke-width="0.5"/>
  
  <!-- Accordion Panels -->
  <rect x="2.5" y="3" width="11" height="2.5" rx="0.5" fill="#fff" stroke="#e6735f" stroke-width="0.3"/>
  <rect x="2.5" y="6.5" width="11" height="2.5" rx="0.5" fill="#fff" stroke="#e6735f" stroke-width="0.3"/>
  <rect x="2.5" y="10" width="11" height="2.5" rx="0.5" fill="#fff" stroke="#e6735f" stroke-width="0.3"/>
  
  <!-- Linien für Text im Accordion -->
  <line x1="9" y1="4.25" x2="12" y2="4.25" stroke="#ff8172" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="9" y1="7.75" x2="12" y2="7.75" stroke="#ff8172" stroke-width="0.7" stroke-linecap="round"/>
  <line x1="9" y1="11.25" x2="12" y2="11.25" stroke="#ff8172" stroke-width="0.7" stroke-linecap="round"/>
  
  <!-- Äußerer Rahmen -->
  <rect x="1" y="1" width="14" height="14" rx="1" fill="none" stroke="#cc5d4a" stroke-width="0.8"/>
</svg>
