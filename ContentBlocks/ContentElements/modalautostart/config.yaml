name: liepstypo3defaults/modalautostart
typeName: modalautostart
group: LIEPS Seiteninhalte
prefixFields: true
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  - identifier: header
    useExistingField: true
    required: true
    label: 'Titel'
  - identifier: bodytext
    useExistingField: true
    type: Textarea
    label: 'Text in der Box'
    enableRichtext: true
  - identifier: image
    useExistingField: true
    type: File
    label: 'Bild'
    minitems: 0
    maxitems: 1
    allowed: common-image-types
  - identifier: header_link
    useExistingField: true
    type: Link
    label: 'Link'
    placeholder: 'Geben Sie hier den Link ein.'
  - identifier: subheader
    useExistingField: true
    type: Text
    label: 'Text des Buttons'
    
