<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 16 16">
  <!-- Hintergrund -->
  <rect x="1" y="2" width="14" height="12" rx="1" fill="#ff8172" stroke="#e6735f" stroke-width="0.5"/>
  
  <!-- Button 1 (Primary) -->
  <rect x="2.5" y="4" width="11" height="2.5" rx="1.25" fill="#fff" opacity="0.9"/>
  <text x="8" y="5.6" text-anchor="middle" fill="#ff8172" font-size="1.2" font-family="Arial, sans-serif" font-weight="bold">Button</text>
  
  <!-- Button 2 (Secondary/Outline) -->
  <rect x="2.5" y="7.5" width="11" height="2.5" rx="1.25" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.9"/>
  <text x="8" y="9.1" text-anchor="middle" fill="#fff" font-size="1.2" font-family="Arial, sans-serif" font-weight="bold">Button</text>
  
  <!-- Button 3 (Small) -->
  <rect x="2.5" y="11" width="6" height="1.8" rx="0.9" fill="#fff" opacity="0.8"/>
  <text x="5.5" y="12.2" text-anchor="middle" fill="#ff8172" font-size="1" font-family="Arial, sans-serif" font-weight="bold">Btn</text>
  
  <!-- Group-Indikator (Kleine Verbindungslinien) -->
  <circle cx="10.5" cy="11.9" r="0.3" fill="#fff" opacity="0.7"/>
  <circle cx="11.5" cy="11.9" r="0.3" fill="#fff" opacity="0.7"/>
  <circle cx="12.5" cy="11.9" r="0.3" fill="#fff" opacity="0.7"/>
  
  <!-- Rahmen -->
  <rect x="1" y="2" width="14" height="12" rx="1" fill="none" stroke="#cc5d4a" stroke-width="0.8"/>
</svg>