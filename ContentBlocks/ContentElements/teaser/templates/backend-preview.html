{namespace be=TYPO3\CMS\Backend\ViewHelpers}
<html data-namespace-typo3-fluid="true">

    <f:layout name="Preview"/>

    <f:section name="Header">
        <be:link.editRecord uid="{data.uid}" table="{data.mainType}"><strong>{data.header}</strong></be:link.editRecord>
    </f:section>

    <f:section name="Content">
        <f:if condition="{data.image}">
            <f:for each="{data.image}" as="file">
                <picture>
                    <f:media file="{file}" width="80" title="{file.title}" alt="{file.alternative}" cropVariant="default" />
                </picture>
            </f:for>
        </f:if>
        <div style="margin: 10px 0 0 0;">
            <f:format.crop maxCharacters="80">{data.bodytext}</f:format.crop>
        </div>
    </f:section>

    <f:section name="Footer">
        (LIEPS) Element zuletzt geändert am
        <f:format.date format="d.m.Y \u\m H:i:s \U\h\r">{data.rawRecord.tstamp}</f:format.date>
    </f:section>

</html>
