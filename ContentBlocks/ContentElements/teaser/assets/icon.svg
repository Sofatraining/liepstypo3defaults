<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 16 16">
  <!-- Card Hintergrund -->
  <rect x="1" y="2" width="14" height="12" rx="1" fill="#ff8172" stroke="#e6735f" stroke-width="0.5"/>
  
  <!-- Bild-Bereich -->
  <rect x="2" y="3" width="12" height="5" rx="0.5" fill="#fff" opacity="0.9"/>
  
  <!-- Bild-Icon (Landschaft) -->
  <circle cx="4" cy="5.5" r="0.8" fill="#ff8172" opacity="0.7"/>
  <path d="M3 7 L5 5.5 L7 6.5 L9 4.5 L13 7" stroke="#ff8172" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  
  <!-- Text-Linien -->
  <rect x="2.5" y="9" width="7" height="0.6" rx="0.3" fill="#fff" opacity="0.9"/>
  <rect x="2.5" y="10" width="9" height="0.6" rx="0.3" fill="#fff" opacity="0.9"/>
  <rect x="2.5" y="11" width="6" height="0.6" rx="0.3" fill="#fff" opacity="0.9"/>
  
  <!-- Button -->
  <rect x="2.5" y="12.2" width="4" height="1" rx="0.5" fill="#fff"/>
  <text x="4.5" y="12.9" text-anchor="middle" fill="#ff8172" font-size="0.6" font-family="Arial">Link</text>
  
  <!-- Rahmen -->
  <rect x="1" y="2" width="14" height="12" rx="1" fill="none" stroke="#cc5d4a" stroke-width="0.8"/>
</svg>
