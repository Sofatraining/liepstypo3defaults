<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Hintergrund / Karte -->
  <rect x="1" y="2" width="14" height="12" rx="1"
        fill="#ff8172" stroke="#e6735f" stroke-width="0.5"/>

  <!-- Avatar: Kopf jetzt mittig auf dem Körper -->
  <circle cx="4.7" cy="6.2" r="1.5" fill="#fff" opacity="0.95"/>
  <path d="M2.7 9.6c0-1.3 1.1-2.3 2.0-2.3s2.0 1.0 2.0 2.3v1.2h-4v-1.2z"
        fill="#fff" opacity="0.95"/>

  <!-- Anführungszeichen: beginnen exakt bei x=7, bündig mit Text -->
  <!-- Linkes Quote -->
  <rect x="7" y="5.4" width="0.7" height="0.7" rx="0.35"
        fill="#fff" opacity="0.95"/>
  <!-- Rechtes Quote -->
  <rect x="8.0" y="5.4" width="0.7" height="0.7" rx="0.35"
        fill="#fff" opacity="0.95"/>

  <!-- Testimonial-Textzeilen (alle bei x=7 beginnend) -->
  <rect x="7" y="6.4" width="6.3" height="1" rx="0.5"
        fill="#fff" opacity="0.9"/>
  <rect x="7" y="8" width="5.5" height="1" rx="0.5"
        fill="#fff" opacity="0.85"/>
  <rect x="7" y="9.6" width="4.7" height="1" rx="0.5"
        fill="#fff" opacity="0.8"/>

  <!-- Rahmen -->
  <rect x="1" y="2" width="14" height="12" rx="1"
        fill="none" stroke="#cc5d4a" stroke-width="0.8"/>
</svg>
