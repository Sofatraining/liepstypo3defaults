<f:layout name="Default" />
<f:section name="Header" />

<f:section name="Main">
    <f:if condition="{data.header}">
        <h4 class="my-4">{data.header}</h4>
    </f:if>

    <div class="testimonials">
        <div class="row">
            <f:for each="{data.items}" as="item">
            <div class="{data.header_position}">
                <div class="testimonial shadow-sm">
                <div class="testimonial-header">
                    <div class="testimonial-info d-flex justify-content-between">
                        <div class="testimonial-info-container">
                            <strong>{item.title}</strong>
                            <div class="testimonial-stars">
                                <div class="testimonial-stars-container">
                                    <f:for each="{0: 1, 1: 2, 2: 3, 3: 4, 4: 5}" as="star">
                                    <f:if condition="{item.sterne} >= {star}">
                                        <svg width="1em" height="1em" fill="#fcbf03" xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 576 512">
                                        <path
                                            d="M259.3 17.8L194 150.2 47.9 171.5c-26.2 3.8-36.7 36.1-17.7 54.6l105.7 103-25 145.5c-4.5 26.3 23.2 46 46.4 33.7L288 439.6l130.7 68.7c23.2 12.2 50.9-7.4 46.4-33.7l-25-145.5 105.7-103c19-18.5 8.5-50.8-17.7-54.6L382 150.2 316.7 17.8c-11.7-23.6-45.6-23.9-57.4 0z">
                                        </path>
                                        </svg>
                                    </f:if>
                                    </f:for>
                                </div>
                                <f:if condition="{item.datum}">
                                    <div class="date-container">
                                    <span class="date">
                                        <f:format.date format="d.m.Y">{item.datum}</f:format.date>
                                    </span>
                                    </div>
                                </f:if>
                            </div>
                        </div>
                        <div class="icon">
                            <f:if condition="{item.bild}">
                            <f:image image="{item.bild.0}" alt="{item.name}" class="timage" />
                            </f:if>
                            <f:if condition="{item.bild -> f:count()} == 0">
                                <div class="timage nopic d-flex justify-content-center align-items-center">
                                    <f:format.crop maxCharacters="1">{item.name}</f:format.crop>
                                </div>
                            </f:if>
                        </div>
                        </div>
                    </div>
                    <div class="testimonial-body">
                        <p class="description">
                        <f:format.html>{item.bewertung}</f:format.html>
                        </p>
                    </div>
                </div>
            </div>
            </f:for>
        </div>
    </div>
</f:section>
