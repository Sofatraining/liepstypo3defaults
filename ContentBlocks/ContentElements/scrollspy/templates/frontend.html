<f:layout name="Default"/>
<f:section name="Header" />

<f:section name="Main">

    <!-- minitems:1, maxitems:1 -> genau ein Layout-Datensatz, aber als Array -->
    <f:for each="{data.collayout}" as="layout">
        <div class="row{f:if(condition: layout.rowClasses, then: ' {layout.rowClasses}')}">

            <!-- FAQ Selector (linke Spalte) -->
            <div id="faq-selector-container"
                 class="faq-selector-container
                    {layout.col1xxl}
                    {layout.col1xl}
                    {layout.col1lg}
                    {layout.col1md}
                    {layout.col1sm}
                    {layout.col1xs}
                    {f:if(condition: layout.col1Classes, then: ' {layout.col1Classes}')}">

                <ul class="faq-selector position-sticky top-0 py-3">
                    <f:if condition="{data.header}">
                        <h3 class="mb-5">{data.header}</h3>
                    </f:if>

                    <f:for each="{data.panels}" as="panel" iteration="iteration">
                        <div class="faq-selector-item">
                            <a href="#faq-list-item-{iteration.index}"
                               title="{panel.title}"
                               class="p-1">
                                <i class="fa-solid fa-arrow-right mt-2 pe-2 ps-0"></i>
                                <span>{panel.title}</span>
                            </a>
                        </div>
                    </f:for>
                </ul>
            </div>

            <!-- FAQ List (rechte Spalte) -->
            <div class="faq-list-container pt-4
                 {layout.col2xxl}
                 {layout.col2xl}
                 {layout.col2lg}
                 {layout.col2md}
                 {layout.col2sm}
                 {layout.col2xs}
                 {f:if(condition: layout.offsetXxl, then: ' offset-xxl-1', else: ' offset-xxl-0')}
                 {f:if(condition: layout.offsetXl,  then: ' offset-xl-1',  else: ' offset-xl-0')}
                 {f:if(condition: layout.offsetLg,  then: ' offset-lg-1',  else: ' offset-lg-0')}
                 {f:if(condition: layout.offsetMd,  then: ' offset-md-1',  else: ' offset-md-0')}
                 {f:if(condition: layout.offsetSm,  then: ' offset-sm-1',  else: ' offset-sm-0')}
                 offset-xs-0
                 {f:if(condition: layout.col2Classes, then: ' {layout.col2Classes}')}"
            >
                <div class="faq-list" data-bs-spy="scroll" data-bs-target="#faq-selector-container" data-bs-smooth-scroll="true" tabindex="0">

                    <f:for each="{data.panels}" as="panel" iteration="iteration">
                        <div id="faq-list-item-{iteration.index}"
                             class="faq-list-item {f:if(condition: iteration.isFirst, then: 'pb-4', else: 'py-4')}">
                            <h4>{panel.title}</h4>

                            <f:if condition="{panel.bild}">
                                <f:if condition="{panel.bildposition} == 'top' || !{panel.bildposition}">
                                    <div class="faq-images mb-3">
                                        <f:for each="{panel.bild}" as="image">
                                            <f:if condition="{panel.lightbox}">
                                                <f:then>
                                                    <f:link.typolink
                                                        parameter="{image.publicUrl}"
                                                        class="image-link d-inline-block me-2 mb-2"
                                                        additionalAttributes="{rel: 'lightbox[{data.computedProperties.localizedUid}]'}">
                                                        <f:image image="{image}" class="img-fluid" />
                                                    </f:link.typolink>
                                                </f:then>
                                                <f:else>
                                                    <f:if condition="{image.link}">
                                                        <f:then>
                                                            <f:link.typolink
                                                                parameter="{image.link}"
                                                                class="d-inline-block me-2 mb-2">
                                                                <f:image image="{image}" class="img-fluid" />
                                                            </f:link.typolink>
                                                        </f:then>
                                                        <f:else>
                                                            <f:image image="{image}" class="img-fluid d-inline-block me-2 mb-2" />
                                                        </f:else>
                                                    </f:if>
                                                </f:else>
                                            </f:if>
                                        </f:for>
                                    </div>
                                </f:if>
                            </f:if>

                            <f:if condition="{panel.text}">
                                <f:format.html>{panel.text}</f:format.html>
                            </f:if>

                            <f:if condition="{panel.bild}">
                                <f:if condition="{panel.bildposition} == 'bottom'">
                                    <div class="faq-images mt-3">
                                        <f:for each="{panel.bild}" as="image">

                                            <!-- LIGHTBOX aktiv -->
                                            <f:if condition="{panel.lightbox}">
                                                <f:then>
                                                    <f:link.typolink
                                                        parameter="{image.publicUrl}"
                                                        class="image-link d-inline-block me-2 mb-2"
                                                        additionalAttributes="{rel: 'lightbox[{data.computedProperties.localizedUid}]'}">
                                                        <f:image image="{image}" class="img-fluid" />
                                                    </f:link.typolink>
                                                </f:then>

                                                <f:else>
                                                    <!-- LIGHTBOX aus: Prüfen auf normalen Bild-Link -->
                                                    <f:if condition="{image.link}">
                                                        <f:then>
                                                            <f:link.typolink
                                                                parameter="{image.link}"
                                                                class="d-inline-block me-2 mb-2">
                                                                <f:image image="{image}" class="img-fluid" />
                                                            </f:link.typolink>
                                                        </f:then>
                                                        <f:else>
                                                            <f:image image="{image}" class="img-fluid d-inline-block me-2 mb-2" />
                                                        </f:else>
                                                    </f:if>
                                                </f:else>
                                            </f:if>

                                        </f:for>
                                    </div>
                                </f:if>
                            </f:if>

                        </div>
                    </f:for>
                </div>
            </div>

        </div>
    </f:for>

</f:section>
