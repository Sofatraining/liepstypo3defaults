name: liepstypo3defaults/stickymenu
typeName: stickymenu
group: LIEPS Inhaltselemente
prefixFields: true
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
  - TYPO3/Access
fields:
  #########################################################################
  # Headline (faq-headline)
  #########################################################################
  - identifier: header
    useExistingField: true
    label: 'FAQ-Überschrift'
    max: 120

  #########################################################################
  # FAQ-Panels (flux:form.section name="panels")
  #########################################################################
  - identifier: panels
    type: Collection
    label: 'FAQ-Einträge'
    minitems: 1
    appearance:
      collapseAll: true
      levelLinksPosition: bottom
    fields:
      - identifier: title
        type: Text
        label: 'Titel'
        required: true
      - identifier: bild
        type: File
        label: 'Bilder'
        maxItems: 3
        appearance:
          collapseAll: true
      - identifier: bildposition
        type: Select
        renderType: selectSingle
        label: 'Position des Bildes'
        default: 'top'
        items:
          - { label: 'Über dem Fließtext', value: 'top' }
          - { label: 'Unter dem Fließtext', value: 'bottom' }
      - identifier: lightbox
        type: Checkbox
        label: 'Lightbox verwenden (Bildvergrößerung beim Anklicken)'
        default: 0  
      - identifier: text
        type: Textarea
        label: 'Text'
        enableRichtext: true        

  #########################################################################
  # Layout-Settings als Collection (ausgelagert in eigene Tabelle)
  # ersetzt: settings.col*xxl/xl/lg/md/sm/xs, settings.offset*, settings.section.*
  #########################################################################
  - identifier: collayout
    type: Collection
    label: 'Layout-Einstellungen'
    minitems: 1
    maxitems: 1
    appearance:
      collapseAll: true
      levelLinksPosition: bottom
    fields:
      # XXL (≥1400px)
      - identifier: col1xxl
        type: Select
        renderType: selectSingle
        label: 'XXL: Breite Spalte 1'
        default: 'col-xxl-4'
        items:
          - { label: '1 - (col-xxl-1)', value: 'col-xxl-1' }
          - { label: '2 - (col-xxl-2)', value: 'col-xxl-2' }
          - { label: '3 - (col-xxl-3)', value: 'col-xxl-3' }
          - { label: '4 - (col-xxl-4)', value: 'col-xxl-4' }
          - { label: '5 - (col-xxl-5)', value: 'col-xxl-5' }
          - { label: '6 - (col-xxl-6)', value: 'col-xxl-6' }
          - { label: '7 - (col-xxl-7)', value: 'col-xxl-7' }
          - { label: '8 - (col-xxl-8)', value: 'col-xxl-8' }
          - { label: '9 - (col-xxl-9)', value: 'col-xxl-9' }
          - { label: '10 - (col-xxl-10)', value: 'col-xxl-10' }
          - { label: '11 - (col-xxl-11)', value: 'col-xxl-11' }
