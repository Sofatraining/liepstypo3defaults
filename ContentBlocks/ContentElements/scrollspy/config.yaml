      - identifier: col2xxl
        type: Select
        renderType: selectSingle
        label: 'XXL: Breite Spalte 2'
        default: 'col-xxl-7'
        items:
          - { label: '1 - (col-xxl-1)', value: 'col-xxl-1' }
          - { label: '2 - (col-xxl-2)', value: 'col-xxl-2' }
          - { label: '3 - (col-xxl-3)', value: 'col-xxl-3' }
