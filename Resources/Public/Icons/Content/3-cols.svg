<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 16 16">
  <!-- Haupthintergrund -->
  <rect x="1" y="2" width="14" height="12" rx="1" fill="#ff8172" stroke="#e6735f" stroke-width="0.5"/>
  
  <!-- Container-Rahmen -->
  <rect x="2.5" y="4" width="11" height="8" rx="0.5" fill="none" stroke="#fff" stroke-width="0.8"/>
  
  <!-- Drei Spalten -->
  <rect x="3.5" y="5" width="2.5" height="6" rx="0.3" fill="#fff" opacity="0.9"/>
  <rect x="6.8" y="5" width="2.5" height="6" rx="0.3" fill="#fff" opacity="0.9"/>
  <rect x="10" y="5" width="2.5" height="6" rx="0.3" fill="#fff" opacity="0.9"/>
  
  <!-- Trennlinien zwischen den Spalten -->
  <line x1="6.3" y1="5.5" x2="6.3" y2="10.5" stroke="#ff8172" stroke-width="0.3"/>
  <line x1="9.5" y1="5.5" x2="9.5" y2="10.5" stroke="#ff8172" stroke-width="0.3"/>
  
  <!-- Grid-Punkte als Symbol für Bootstrap-Grid -->
  <circle cx="4.7" cy="6.5" r="0.2" fill="#ff8172" opacity="0.7"/>
  <circle cx="4.7" cy="8" r="0.2" fill="#ff8172" opacity="0.7"/>
  <circle cx="4.7" cy="9.5" r="0.2" fill="#ff8172" opacity="0.7"/>
  
  <circle cx="8" cy="6.5" r="0.2" fill="#ff8172" opacity="0.7"/>
  <circle cx="8" cy="8" r="0.2" fill="#ff8172" opacity="0.7"/>
  <circle cx="8" cy="9.5" r="0.2" fill="#ff8172" opacity="0.7"/>
  
  <circle cx="11.2" cy="6.5" r="0.2" fill="#ff8172" opacity="0.7"/>
  <circle cx="11.2" cy="8" r="0.2" fill="#ff8172" opacity="0.7"/>
  <circle cx="11.2" cy="9.5" r="0.2" fill="#ff8172" opacity="0.7"/>
  
  <!-- Äußerer Rahmen -->
  <rect x="1" y="2" width="14" height="12" rx="1" fill="none" stroke="#cc5d4a" stroke-width="0.8"/>
</svg>