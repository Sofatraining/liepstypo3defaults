<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 16 16">
  <!-- Haupthintergrund -->
  <rect x="1" y="2" width="14" height="12" rx="1" fill="#ff8172" stroke="#e6735f" stroke-width="0.5"/>
  
  <!-- Section-Container (eine große Fläche) -->
  <rect x="2.5" y="4" width="11" height="8" rx="0.5" fill="#fff" opacity="0.9" stroke="#ff8172" stroke-width="0.3"/>
  
  <!-- Section-Symbol (gestapelte Linien für Content-Bereiche) -->
  <rect x="4" y="5.5" width="8" height="0.8" rx="0.4" fill="#ff8172" opacity="0.8"/>
  <rect x="4" y="7" width="6" height="0.8" rx="0.4" fill="#ff8172" opacity="0.6"/>
  <rect x="4" y="8.5" width="8" height="0.8" rx="0.4" fill="#ff8172" opacity="0.8"/>
  <rect x="4" y="10" width="5" height="0.8" rx="0.4" fill="#ff8172" opacity="0.6"/>
  
  <!-- Container-Indikator (Eckmarkierungen) -->
  <path d="M3 4.5 L3 4 L3.5 4" stroke="#fff" stroke-width="0.6" fill="none" stroke-linecap="round"/>
  <path d="M12.5 4 L13 4 L13 4.5" stroke="#fff" stroke-width="0.6" fill="none" stroke-linecap="round"/>
  <path d="M13 11.5 L13 12 L12.5 12" stroke="#fff" stroke-width="0.6" fill="none" stroke-linecap="round"/>
  <path d="M3.5 12 L3 12 L3 11.5" stroke="#fff" stroke-width="0.6" fill="none" stroke-linecap="round"/>
  
  <!-- Äußerer Rahmen -->
  <rect x="1" y="2" width="14" height="12" rx="1" fill="none" stroke="#cc5d4a" stroke-width="0.8"/>
</svg>